<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIC Exit Time</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: #f9fafb;
            --accent: #111827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 320px;
            padding: 14px;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            display: grid;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 14px;
            line-height: 1.2;
            font-weight: 600;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-size: 11px;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 13px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }

        button {
            padding: 9px 12px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .link {
            color: var(--muted);
            font-size: 12px;
            text-decoration: none;
        }

        .status {
            min-height: 16px;
            font-size: 12px;
            color: var(--muted);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header h1 {
            margin: 0;
            flex: 1;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .settings-btn:hover {
            color: var(--text);
        }

        .mode-section {
            display: none;
        }

        .mode-section.active {
            display: block;
        }

        .time-rows-header {
            display: grid;
            grid-template-columns: 1fr 1fr 24px;
            gap: 8px;
            padding: 0 2px;
        }

        .time-rows-header span {
            font-size: 11px;
            color: var(--muted);
        }

        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .remove-row-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            width: 24px;
            text-align: center;
        }

        .remove-row-btn:hover {
            color: var(--text);
        }

        .time-rows-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .add-row-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            font-weight: 400;
        }

        .add-row-btn:hover {
            color: var(--text);
        }

        .result {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            text-align: center;
            margin-top: 4px;
        }

        .result-exit {
            font-size: 40px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-bottom: 8px;
        }

        .result-meta {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            justify-content: center;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <h1 id="mode-title">Enter / Exit</h1>
            <button type="button" class="settings-btn" id="settings-toggle" title="Settings">⚙️</button>
        </div>

        <!-- Enter/Exit Mode -->
        <form class="mode-section active" id="time-form">
            <div class="time-rows-header">
                <span>In</span>
                <span>Out</span>
                <span></span>
            </div>
            <div id="time-rows"></div>
            <div class="time-rows-footer">
                <button type="button" class="add-row-btn" id="add-row-btn">+ Add row</button>
                <button type="submit">Save</button>
            </div>
            <div class="result" id="result">
                <div class="result-exit" id="result-exit">--:--</div>
                <div class="result-meta" id="result-meta"></div>
            </div>
            <div class="status" id="time-status"></div>
        </form>

        <!-- Settings Mode -->
        <form class="mode-section" id="popup-form">
            <div class="field">
                <label for="dailyHours">Hours per day</label>
                <input id="dailyHours" type="number" min="1" max="24" step="0.25" />
            </div>

            <div class="row">
                <div class="field">
                    <label for="breakMin">Break min</label>
                    <input id="breakMin" type="number" min="0" max="300" step="1" />
                </div>

                <div class="field">
                    <label for="breakMax">Break max</label>
                    <input id="breakMax" type="number" min="0" max="300" step="1" />
                </div>
            </div>

            <div class="actions">
                <button type="submit">Save</button>
            </div>

            <div class="status" id="status"></div>
        </form>
    </div>

    <script src="popup.js"></script>
</body>
</html>
