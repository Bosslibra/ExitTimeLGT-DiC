<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIC Exit Time</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: #f9fafb;
            --accent: #111827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 320px;
            padding: 14px;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            display: grid;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 14px;
            line-height: 1.2;
            font-weight: 600;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-size: 11px;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 13px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }

        button {
            padding: 9px 12px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .link {
            color: var(--muted);
            font-size: 12px;
            text-decoration: none;
        }

        .status {
            min-height: 16px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <form class="wrap" id="popup-form">
        <h1>Settings</h1>

        <div class="field">
            <label for="dailyHours">Hours per day</label>
            <input id="dailyHours" type="number" min="1" max="24" step="0.25" />
        </div>

        <div class="row">
            <div class="field">
                <label for="breakMin">Break min</label>
                <input id="breakMin" type="number" min="0" max="300" step="1" />
            </div>

            <div class="field">
                <label for="breakMax">Break max</label>
                <input id="breakMax" type="number" min="0" max="300" step="1" />
            </div>
        </div>

        <div class="actions">
            <button type="submit">Save</button>
        </div>

        <div class="status" id="status"></div>
    </form>

    <script src="popup.js"></script>
</body>
</html>
